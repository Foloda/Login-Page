<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <!-- Welcom Back Section -->
        <section class="hero-section">
            <div>
                <h1>Welcome Back</h1>
                <p>Unlock your insights. Access your workspace effortlessly</p>
            </div>
        </section>

        <!-- Log in Section -->
        <section class="login-section">
            <div class="login-container">
                <!-- Main title -->
                <div class="login-title">
                    <h1>Log In</h1>
                    <p>Enter your credentials to continue</p>
                </div>

                <!-- Email Input -->
                <div class="input-container">
                    <h3>Email Address</h3>
                    <input type="email" name="email" id="" placeholder="you@company.com">
                </div>

                <!-- Password input -->
                <div class="input-container">
                    <span style="display: flex;
                    justify-content: space-between; align-items: center;">
                        <h3>Password</h3>
                        <a href="reset.html">Forgot Password?</a>
                    </span>
                    <input type="password" name="" id="" placeholder="**********">
                </div>

                <!-- Log in Button -->
                <div class="login-button">
                    <a href="">Log In</a>
                </div>

                <!-- Sign In With -->
                <div class="sign-in-with">
                    <span>
                        <svg xmlns="http://w3.org" viewBox="0 0 100 10" width="100%" height="10">
                            <line x1="0" y1="5" x2="100" y2="5" stroke="#00000082" stroke-width="1" />
                        </svg>
                    </span>
                    <span>
                        <h3>Or Sign in with</h3>
                    </span>
                    <span>
                        <svg xmlns="http://w3.org" viewBox="0 0 100 10" width="100%" height="10">
                            <line x1="0" y1="5" x2="100" y2="5" stroke="#00000082" stroke-width="1" />
                        </svg>
                    </span>
                </div>


                <div class="sign-in-with-">
                    <a href="https://accounts.google.com/v3/signin/identifier?continue=https://www.google.com/&ec=futura_exp_og_so_72776762_e&hl=ka&passive=true&flowName=GlifWebSignIn&flowEntry=ServiceLogin&dsh=S219100094:1792411130832513"
                        target="_blank">
                        <span>
                            <img src="assets/logos/google-icon-logo-svgrepo-com.svg" alt="google"
                                style="width: 50%; height: 50%;">
                        </span>
                    </a>
                    <a href="https://login.microsoftonline.com/" target="_blank">
                        <span>
                            <img href="https://login.microsoftonline.com/" src="assets/logos/microsoft-svgrepo-com.svg"
                                alt="microsoft" style="width: 50%; height: 50%;">
                        </span>

                    </a>
                    <a href="https://github.com/login" target="_blank">
                        <span>
                            <img src="assets/logos/github-svgrepo-com.svg" alt="github"
                                style="width: 60%; height: 60%;">
                        </span>
                    </a>
                </div>

                <!-- Redirect To Registration Page -->
                <div class="sign-up-">
                    <p>Don't have an account?</p>&nbsp;<a href="signup.html">Sign Up</a>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
